# Release — 一键发布三平台发行版
#
# 触发方式:
#   1. 手动: Actions → Release → Run workflow (可填版本号)
#   2. 打 tag: git tag v0.2.0 && git push origin v0.2.0
#
# 产物:
#   - Linux x64     : 源码包 + PyInstaller 可执行文件 (best-effort)
#   - Windows x64   : 源码包 + PyInstaller 可执行文件 (best-effort)
#   - Android ARM   : debug APK (arm64-v8a + armeabi-v7a，可直接安装)

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 0.2.0)"
        required: true
        default: "0.2.0"
        type: string
  push:
    tags:
      - "v*"

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          [ -z "$VER" ] && VER="0.1.0"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  # ==================== Linux x64 ====================
  linux-host:
    name: Linux x64 Host
    runs-on: ubuntu-latest
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (GStreamer + PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            python3-gi python3-gi-cairo gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            xdotool
          python -m pip install --upgrade pip

      - name: Verify host runs
        run: |
          cd host
          PYTHONPATH=. python3 -m psp_host --help | head -5
          PYTHONPATH=. python3 -m psp_host --list-outputs

      - name: Run unit tests
        run: |
          python3 -m unittest tests.test_protocol -v

      - name: Package source tarball (Linux)
        run: |
          mkdir -p dist/packages
          VER="${{ needs.read-version.outputs.version }}"
          TARBALL="SecondScreen-linux-x64-${VER}.tar.gz"
          tar -czf "dist/packages/${TARBALL}" \
            host/ scripts/ docs/ README.md \
            --transform "s,^,SecondScreen-${VER}/,"
          echo "✓ Created ${TARBALL}"

      - name: PyInstaller build (best-effort)
        continue-on-error: true
        run: |
          pip install pyinstaller
          cd host
          pyinstaller --name psp-host-linux-x64 \
            --onefile --clean \
            --collect-submodules gi \
            --hidden-import gi.repository \
            psp_host/__main__.py
          ls -lh dist/psp-host-linux-x64 2>/dev/null && cp dist/psp-host-linux-x64 ../dist/packages/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/packages/*
          retention-days: 14

  # ==================== Windows x64 ====================
  windows-host:
    name: Windows x64 Host
    runs-on: windows-latest
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyGObject from Wheels
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install PyGObject==3.50.0 2>&1 | tail -5

      - name: Package source zip (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path dist\packages | Out-Null
          $VER = "${{ needs.read-version.outputs.version }}"
          Compress-Archive -Path host, scripts, docs, README.md -DestinationPath "dist\packages\SecondScreen-windows-x64-$VER.zip" -Force
          Write-Host "✓ Created zip"

      - name: PyInstaller build (best-effort)
        continue-on-error: true
        run: |
          pip install pyinstaller
          Set-Location host
          python -m PyInstaller --name psp-host-windows-x64 --onefile --clean psp_host/__main__.py
          Get-ChildItem dist\psp-host-windows-x64.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "..\dist\packages\"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/packages/*
          retention-days: 14

  # ==================== Android ARM ====================
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          VER="${{ needs.read-version.outputs.version }}"
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          mkdir -p dist/packages
          cp "$APK" "dist/packages/SecondScreen-android-${VER}.apk"
          echo "✓ APK ready"
          ls -lh dist/packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/packages/*.apk
          retention-days: 14

  # ==================== 汇总发布 ====================
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [read-version, linux-host, windows-host, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: |
          ls -lhR release-assets/
          cd release-assets
          md5sum * > checksums.txt 2>/dev/null || sha256sum * > checksums.txt

      - name: Write release notes
        run: |
          VER="${{ needs.read-version.outputs.version }}"
          cat > release-notes.md << EOF
          ## SecondScreen v${VER} 发行版

          ### 📦 包含产物
          - **Android APK** (SecondScreen-android-*.apk) — 直接安装到设备 (arm64 + armv7)
          - **Linux x64** (SecondScreen-linux-x64-*.tar.gz) — 解压后按 README 安装依赖
          - **Windows x64** (SecondScreen-windows-x64-*.zip) — 解压后按 README 安装依赖

          ### 🚀 快速开始 (Linux)
          sudo apt install gstreamer1.0-plugins-ugly python3-gi xdotool
          cd SecondScreen-\${VER}/host && python3 -m psp_host

          ### 🔌 连接方式
          - WiFi: 局域网自动发现 / 手动输入 IP
          - USB: scripts/adb-usb-setup.sh --mode usb
          - 无线ADB: scripts/adb-usb-setup.sh --mode wireless

          ### 🖥 平台支持
          - Linux: X11 + Wayland (GNOME/Sway/Hyprland)
          - Windows: DXGI 捕获 (虚拟显示器需第三方驱动)
          - Android: MediaCodec 硬件解码 H.264/VP9/VP8
          EOF
          echo "Release notes written"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.read-version.outputs.version }}"
          TAG="v${VER}"
          gh release create "$TAG" \
            --title "SecondScreen v${VER}" \
            --notes-file release-notes.md \
            release-assets/checksums.txt \
            release-assets/*.tar.gz \
            release-assets/*.zip \
            release-assets/*.apk 2>&1 || echo "::warning::Release 创建失败，assets 已在 artifacts 中"