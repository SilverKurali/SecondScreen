# Release — 一键发布三平台"点击即用"发行版
#
# 触发方式:
#   1. 手动: Actions → Release → Run workflow (可填版本号)
#   2. 打 tag: git tag v0.5.1 && git push origin v0.5.1
#
# 产物（全部免安装、免依赖下载）:
#   - Linux x64     : AppImage（捆绑 Python + GTK4 GUI + GStreamer + 编码器）
#   - Windows x64   : 便携 zip（psp-host.exe + GTK4/GStreamer 全部运行库）
#   - Android ARM   : debug APK (arm64-v8a + armeabi-v7a，直接安装)
#
# 每个平台打包后都执行 --selftest 冒烟自检（GTK4/GStreamer/编码器/协议层），
# 自检失败则构建失败，确保发行版功能完整可用。

name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 0.5.1)"
        required: true
        default: "0.5.1"
        type: string
  push:
    tags:
      - "v*"

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          [ -z "$VER" ] && VER="0.1.0"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  # ==================== Linux x64 AppImage ====================
  linux-appimage:
    name: Linux x64 AppImage
    runs-on: ubuntu-22.04
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (GTK4 + GStreamer + GI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo python3-venv \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gtk-4.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools \
            xdotool x11-xserver-utils

      - name: Run unit tests
        run: python3 -m unittest tests.test_protocol -v

      - name: Build AppImage (内含 --selftest 冒烟自检)
        run: bash host/packaging/build_appimage.sh "${{ needs.read-version.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/packages/*.AppImage
          retention-days: 14

  # ==================== Windows x64 便携 EXE ====================
  windows-exe:
    name: Windows x64 EXE
    runs-on: windows-latest
    needs: [read-version]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup MSYS2 (UCRT64: Python + PyGObject + GTK4 + GStreamer)"
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run unit tests
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m unittest tests.test_protocol -v

      - name: Build portable bundle (内含 --selftest 冒烟自检)
        run: bash host/packaging/build_windows.sh

      - name: Zip portable package
        shell: pwsh
        run: |
          $VER = "${{ needs.read-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist\packages | Out-Null
          Compress-Archive -Path host\dist\psp-host\* `
            -DestinationPath "dist\packages\SecondScreen-windows-x64-$VER.zip" -Force
          Get-ChildItem dist\packages | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist\packages\*.zip
          retention-days: 14

  # ==================== Android ARM APK ====================
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [read-version]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          VER="${{ needs.read-version.outputs.version }}"
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          mkdir -p dist/packages
          cp "$APK" "dist/packages/SecondScreen-android-${VER}.apk"
          echo "✓ APK ready"
          ls -lh dist/packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/packages/*.apk
          retention-days: 14

  # ==================== 汇总发布 ====================
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [read-version, linux-appimage, windows-exe, android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: |
          ls -lhR release-assets/
          cd release-assets
          sha256sum * > checksums.txt

      - name: Write release notes
        run: |
          VER="${{ needs.read-version.outputs.version }}"
          cat > release-notes.md << EOF
          ## SecondScreen v${VER} — 点击即用发行版

          ### 📦 产物（全部免安装、免依赖下载）
          - **Linux**: SecondScreen-linux-x64-\${VER}.AppImage — 捆绑 Python+GTK4+GStreamer+编码器，\`chmod +x\` 后双击/命令行运行
          - **Windows**: SecondScreen-windows-x64-\${VER}.zip — 解压后直接运行 psp-host.exe
          - **Android**: SecondScreen-android-\${VER}.apk — 直接安装 (arm64 + armv7, Android 8.0+)

          所有产物在 CI 中通过 \`--selftest\` 冒烟自检（GTK4 GUI 类型库 / GStreamer /
          编码器 / 协议层 / 输入模块），自检通过才发布。

          ### 🚀 快速开始
          **Linux** (Wayland 会话本身仍需系统自带，属桌面组件):
          \`\`\`bash
          ./SecondScreen-linux-x64-\${VER}.AppImage          # 启动服务（自动创建虚拟屏）
          ./SecondScreen-linux-x64-\${VER}.AppImage --gui    # GTK4 图形控制台
          \`\`\`
          若系统不支持 FUSE: \`./xxx.AppImage --appimage-extract-and-run\`

          **Windows**: 解压 zip → 双击 \`psp-host.exe\`（或 \`psp-host.exe --gui\`）。
          Windows 虚拟显示器需第三方驱动（见 README）。

          **Android**: 安装 APK → 自动发现局域网主机或手动输入 IP → 连接。

          ### 🔌 连接方式
          - WiFi: 局域网自动发现 (UDP 4748) / 手动输入 IP:4747
          - USB: \`psp-host --adb usb\` 建立反向隧道，安卓端点「USB 模式」

          ### ⚠ 注意
          - Linux 输入回传需用户在 \`input\` 组（evdev uinput），重启后生效
          - 首次运行 Windows exe 可能被 SmartScreen 提示，选择「仍要运行」
          EOF
          echo "Release notes written"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.read-version.outputs.version }}"
          TAG="v${VER}"
          # 幂等：若同名 Release 已存在（重跑场景）先删除再重建
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "SecondScreen v${VER}" \
            --notes-file release-notes.md \
            release-assets/checksums.txt \
            release-assets/*.AppImage \
            release-assets/*.zip \
            release-assets/*.apk 2>&1 || echo "::warning::Release 创建失败，assets 已在 artifacts 中"
