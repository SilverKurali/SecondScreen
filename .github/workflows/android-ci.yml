# Android CI — 安卓端 APK 构建 + 检查
#
# 运行:
#   - Gradle assembleDebug
#   - Android Lint
#   - 检查 APK 产物

name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build debug APK
        run: |
          cd android
          # Create gradle wrapper if missing
          if [ ! -f gradlew ]; then
            apt-get update && apt-get install -y gradle 2>/dev/null || true
            gradle wrapper --gradle-version 8.9 2>/dev/null || true
          fi
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Verify APK exists
        run: |
          APK=$(find android -name "*.apk" -type f 2>/dev/null | head -5)
          if [ -z "$APK" ]; then
            echo "⚠ No APK found"
          else
            echo "✓ APK found:"
            ls -lh $APK
          fi
        continue-on-error: true

      - name: Run Android lint
        run: |
          cd android
          ./gradlew lint --no-daemon 2>&1 | tail -30 || true
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: psp-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Cleanup Gradle cache
        if: always()
        run: |
          rm -rf ~/.gradle/caches/modules-2/modules-2.lock
          rm -rf ~/.gradle/caches/*/plugin-resolution/