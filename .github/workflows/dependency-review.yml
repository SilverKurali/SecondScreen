# Dependency Review — PR 依赖变更审查

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
          # 允许的许可证白名单
          allow-licenses: |
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause,
            ISC, Unlicense, PSF-2.0, LGPL-2.1-only,
            LGPL-2.1-or-later, LGPL-3.0-only, GPL-2.0-only,
            GPL-3.0-only, MPL-2.0, CC0-1.0