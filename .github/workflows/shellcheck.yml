# ShellCheck — 脚本语法检查
#
# 检查所有 .sh 文件是否有语法错误和常见问题

name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: "warning"
          ignore_names: "99-psp-dummy.conf"
          additional_files: |
            scripts/adb-usb-setup.sh
            host/scripts/setup-virtual-display.sh
            host/scripts/setup-virtual-display-wayland.sh