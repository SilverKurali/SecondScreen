# Welcome — 新贡献者首次互动问候

name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 感谢你提交 Issue！请确保：
            - 描述清楚复现步骤
            - 附上运行环境（OS / 显示服务器 / Python 版本）
            - 如有日志请贴出相关片段

            项目维护者会尽快回复。再次感谢你的贡献！
          pr-message: |
            🎉 感谢你的 PR！提交后 CI 会自动运行：
            - Python CI：语法 / 风格 / 类型 / 单元测试
            - Integration CI：多版本矩阵 + GUI 冒烟 + 安全扫描
            - CodeQL：安全分析
            - Lint & Format：拼写 / Markdown / YAML 检查

            请确保所有检查通过。期待你的贡献！