name: Bug Report
description: 报告一个 Bug 帮助我们改进
title: "[Bug] "
labels: [bug, triage]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug 报告
        感谢你花时间填写此报告！

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述这个 Bug 是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个行为？
      placeholder: |
        1. 运行 '...'
        2. 点击 '....'
        3. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请填写你的运行环境
      placeholder: |
        - OS: (e.g. Ubuntu 24.04 / Windows 11)
        - 显示服务器: (X11 / Wayland / Hyprland)
        - Python 版本: (e.g. 3.12.4)
        - 设备型号: (e.g. OnePlus 12 / Samsung S24)
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 如有相关日志或截图，请附上
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，没有重复
          required: true
        - label: 我已确认这是最新版本的问题
          required: true