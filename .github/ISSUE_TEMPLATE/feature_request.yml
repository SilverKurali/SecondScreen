name: Feature Request
description: 为新功能或改进提出建议
title: "[Feature] "
labels: [enhancement]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ 功能建议
        感谢你的想法！请描述清楚你希望看到什么变化。

  - type: textarea
    id: problem
    attributes:
      label: 相关的问题 / 痛点
      description: 这个功能解决什么问题？有什么场景让你觉得需要它？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望怎么实现？描述清楚行为即可
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，没有重复建议
          required: true