# 99-psp-dummy.conf — 启用 modesetting 驱动的虚拟显示器输出
#
# 将此文件放到 /etc/X11/xorg.conf.d/ 后重启 X11 会话，
# 系统会创建额外的虚拟输出（如 VIRTUAL1、VIRTUAL2）。
# 然后便可以使用 xrandr 为其分配分辨率并启用。
#
# 安装:
#   sudo cp 99-psp-dummy.conf /etc/X11/xorg.conf.d/
#   # 重启 X11 会话（或重启系统）
#
# 验证:
#   xrandr | grep VIRTUAL
#
# 使用虚拟输出:
#   ./setup-virtual-display.sh --mode 1920x1080 --rate 60
#   python -m psp_host --output VIRTUAL1 --resolution 1080p --fps 60

Section "Device"
    Identifier  "Card0"
    Driver      "modesetting"
    Option      "VirtualHeads" "1"
EndSection